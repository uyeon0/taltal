name: CI

on:
  pull_request:
    branches: [main]

# 같은 PR에 새 커밋이 오면 앞의 실행을 멈춘다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 일부 테스트가 실제 앱 데이터로 계산을 확인한다. 배포와 같은 방법으로 data/app/에 받는다
      - name: Checkout app data
        uses: actions/checkout@v4
        with:
          repository: uyeon0/camp-project-1-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: .app-data

      - name: Copy app data
        run: |
          mkdir -p data/app
          cp .app-data/app/*.json data/app/
          rm -rf .app-data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
