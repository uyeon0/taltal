<!--
  구현 기준: docs/requirements/와 docs/design.md. 이 시안은 배치 참고 자료다.

  UI/UX 라이팅은 시안용 임의 문구입니다. 제목, 안내, 버튼, 오류 메시지는
  확정된 서비스 문구가 아니며 구현 전 별도 검토가 필요합니다.
  독립 실행용: 외부 이미지·폰트·라이브러리·네트워크 요청이 없습니다.
  모든 추천과 조리법은 인터랙션 검토용 가상 데이터이며 실제 추천 결과가 아닙니다.
  2026-10-31 / 요리 우선 발전안. 잔량은 별도 시트에서 확인합니다.

  Reference lock / 결정 근거:
  - Crouton: 작은 이미지 + 제목 행으로 여러 요리를 한 묶음으로 읽게 함.
    https://refero.design/screens/9f1f52d3-d1e6-4eb9-b141-d4ec68f35b55
  - Copilot: 항목별 막대 + 정렬된 수량. 전체 합산 도넛/백분율은 사용하지 않음.
    https://refero.design/screens/0f46f651-a52f-4e1b-929c-328c805307f5
  - Crouton ingredient sheet: 상세 재료 목록을 별도 시트로 분리.
    https://refero.design/screens/1ccfd142-b2ea-448d-a3da-68612c4ef111
  - 결과 화면 구성: 가짓수별 조합, 입력 단위 잔량, 구매 전환, 상세 시트.
  - 사용자 제약: 흑백, 적은 버튼, 펼쳐 보는 상세, 더미 이미지, 독립 HTML.
  - 모든 너비에서 바텀시트 사용. 누적 잔량 표시는 이번 시안에서 제외.
  - 레시피 상세: 보유 재료 + 추가 구매 재료 + 기본 양념/물을 모두 표시.
  - 상단 검토 상태 선택기와 바깥 프레임은 시안 검토용이며 제품 UI가 아닙니다.
  - 파일 하나로 실행. 실제 추천 API·영구 저장·입력 화면 편집은 연결하지 않음.
  - 결과가 악화되는 가짓수 숨김은 실제 추천 로직에 속함. 여기서는 모두 표시.
-->

<main class="workbench">
 <header class="bench-head"><div><h1>추천 결과 / 요리 우선</h1><p>소진·잔량 요약과 요리 목록</p></div></header>
 <div class="tools"><label for="scenario">검토할 상태</label><select id="scenario"><option value="normal">일반 결과</option><option value="loading">계산 중</option><option value="purchaseOnly">추가 구매 필요</option><option value="empty">추천 없음</option><option value="error">서버 오류</option></select></div>
 <section class="phone" aria-label="추천 결과 모바일 화면"><nav class="top"><button id="back">← 재료 수정</button></nav><div id="app" class="content"></div></section>
 <p class="footer">시안용 가상 데이터 · 버튼과 목록을 눌러볼 수 있어요. 재료 수정에서는 예시 입력값 확인만 가능합니다.</p>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="sheet-head"><strong id="sheet-label">레시피 상세</strong><button class="close" aria-label="상세 닫기">✕</button></div><div id="detail-body" class="sheet-body"></div></dialog>
<script>
'use strict';
const inventory = [{ name: '두부', amount: 1, unit: '모', grams: 300 }, { name: '계란', amount: 6, unit: '개', grams: 50 }, { name: '대파', amount: 1, unit: '대', grams: 100 }, { name: '애호박', amount: 1, unit: '개', grams: 300 }];
const recipes = [
    { name: '두부 달걀전', time: 20, use: [.5, 2, .2, 0], steps: ['두부의 물기를 제거하고 으깬 뒤 달걀과 다진 대파를 섞어요.', '소금으로 간하고 작은 크기로 나누어요.', '기름을 두른 팬에서 양면을 충분히 익혀요.'] },
    { name: '애호박 두부볶음', time: 15, use: [.5, 0, .2, .5], steps: ['두부와 애호박을 먹기 좋은 크기로 썰어요.', '팬에 대파를 볶고 두부와 애호박을 넣어요.', '간장으로 간하고 속까지 익혀요.'] },
    { name: '애호박 달걀국', time: 15, use: [0, 2, .2, .5], steps: ['애호박과 대파를 썰어요.', '끓는 물에 애호박을 넣고 익혀요.', '푼 달걀과 대파를 넣어 충분히 익히고 간해요.'] },
    { name: '대파 달걀볶음', time: 10, use: [0, 1, .2, 0], steps: ['대파를 잘게 썰고 달걀을 풀어요.', '팬에 대파를 볶아 향을 내요.', '달걀을 넣고 완전히 익혀요.'] },
    { name: '달걀찜', time: 15, use: [0, 1, 0, 0], steps: ['달걀과 물을 섞고 소금으로 간해요.', '내열 용기에 담고 찜기에 올려요.', '속까지 완전히 익을 때까지 쪄요.'] }
];
// 전체 재료 목록용 예시. 재고 소진 계산은 보유 재료(use)만 대상으로 합니다.
const pantryIngredients = [
    [{ name: '소금', amount: '¼작은술' }, { name: '식용유', amount: '1큰술' }],
    [{ name: '간장', amount: '1큰술' }, { name: '식용유', amount: '1큰술' }],
    [{ name: '물', amount: '500ml' }, { name: '소금', amount: '¼작은술' }, { name: '국간장', amount: '1작은술' }],
    [{ name: '소금', amount: '¼작은술' }, { name: '식용유', amount: '1큰술' }],
    [{ name: '물', amount: '150ml' }, { name: '소금', amount: '¼작은술' }]
];
const state = { count: 5, buy: false, scenario: 'normal', input: false };
const app = document.getElementById('app'), dialog = document.getElementById('detail');
// 표시 전용: 작은 양수는 자릿수를 늘려 0으로 보이지 않게 합니다. 세부 표기 정책은 구현 과제입니다.
const fmt = n => n > 0 && n < .01
  ? n.toLocaleString('ko-KR', {maximumSignificantDigits:3, useGrouping:false})
  : Number(n.toFixed(2)).toString();
function selected() { return recipes.slice(0, state.count).map((r, i) => state.buy && i === 0 ? { ...r, use: r.use.map((n, k) => k === 2 ? n + .2 : n) } : r); }
function stock() { return inventory.map((x, i) => { const used = selected().reduce((s, r) => s + r.use[i], 0); return { ...x, index: i, used, left: Math.max(0, Math.abs(x.amount-used) <= Number.EPSILON*x.amount*8 ? 0 : x.amount-used) }; }).sort((a, b) => b.left / b.amount - a.left / a.amount); }
function fullCount(n) { return inventory.filter((x, i) => Math.abs(x.amount - recipes.slice(0, n).reduce((s, r) => s + r.use[i], 0) - (state.buy && i === 2 ? .2 : 0)) < .0001).length; }
function uses(r) { return r.use.map((n, i) => n ? `${inventory[i].name} ${fmt(n)}${inventory[i].unit}` : '').filter(Boolean).join(' · '); }
function recipeList() { return `<section class="section recipe-section" aria-label="추천 요리 목록">${selected().map((r, i) => `<button class="recipe" data-recipe="${i}"><span class="placeholder" aria-hidden="true">이미지</span><span class="copy"><span class="recipe-title"><strong>${state.buy && i === 0 ? '청고추 두부 달걀전' : r.name}</strong><span class="meta">${r.time}분</span></span><span class="uses">${uses(r)}</span>${i === 0 ? '<span class="order">두부가 들어가 먼저 만들면 좋아요</span>' : ''}${state.buy && i === 0 ? '<span class="buy-label">추가 구매 · 청고추 15g</span>' : ''}</span><span class="chevron" aria-hidden="true">›</span></button>`).join('')}</section>`; }
function openStock() { document.getElementById('sheet-label').textContent = '재료 사용량'; document.getElementById('detail-body').innerHTML = `<p class="eyebrow">${state.count}가지 요리 · 각 2인분</p><h2 id="detail-title">요리하고 나면</h2><p>막대는 가진 양 중 쓰는 양이에요.<br>재료를 펼치면 요리별 배분을 볼 수 있어요.</p>${stockList()}${state.buy ? '<div class="notice">추가 구매: 청고추 조금 (15g)<br>첫 번째 전 요리에 모두 사용해요.</div>' : ''}`; dialog.showModal(); }
function stockList() { return `<section class="section"><div class="section-head"><h3>재료는 얼마나 남을까요?</h3><span>많이 남는 순</span></div>${stock().map(x => `<div class="remaining-row"><div class="row-label"><span>${x.name}</span><strong>${x.left ? fmt(x.left) + x.unit + ' 남음' : '다 써요'}</strong></div><div class="track" role="img" aria-label="${x.name} ${fmt(x.amount)}${x.unit} 중 ${fmt(x.used)}${x.unit} 사용"><div class="fill" style="width:${x.used / x.amount * 100}%"></div></div><details><summary>${fmt(x.amount)}${x.unit} 중 ${fmt(x.used)}${x.unit} 사용</summary><p class="allocation">${selected().filter(r => r.use[x.index]).map(r => `${r.name} ${fmt(r.use[x.index])}${x.unit}`).join('<br>')}</p></details></div>`).join('')}</section>`; }
function render() {
    document.getElementById('back').textContent = state.input ? '← 결과로 돌아가기' : '← 재료 수정';
    if (state.input) {
        app.innerHTML = `<p class="eyebrow">입력값 유지 확인</p><h2>입력한 재료</h2><p class="intro">이 시안에서는 입력값 확인만 가능해요.</p><ul class="input-list">${inventory.map(x => `<li><span>${x.name}</span><strong>${x.amount}${x.unit}</strong></li>`).join('')}</ul><p>한 번에 2인분</p><button class="primary" data-action="return">결과로 돌아가기</button>`;
        return;
    }
    if (state.scenario === 'loading') {
        app.innerHTML = '<div class="empty" role="status"><div class="spinner"></div><h2>재료를 나눠 쓰는<br>조합을 찾고 있어요</h2><p class="intro">입력한 재료와 수량은 그대로 있어요.</p><button class="secondary" data-action="retry">예시 결과 보기</button></div>';
        return;
    }
    if (state.scenario === 'error' || state.scenario === 'empty') {
        const err = state.scenario === 'error';
        app.innerHTML = `<div class="empty" role="status"><p class="eyebrow">${err ? '잠시 연결이 끊겼어요' : '추천 결과 없음'}</p><h2>${err ? '추천을 불러오지 못했어요' : '이 재료로 만들 수 있는<br>요리를 찾지 못했어요'}</h2><p class="intro">${err ? '입력한 재료는 그대로 유지하고 있어요.' : '대파·양파처럼 자주 쓰는 재료를 더 넣어 보세요.'}</p><button class="primary" data-action="${err ? 'retry' : 'input'}">${err ? '다시 시도' : '재료 수정하기'}</button></div>`;
        return;
    }
    const remaining = stock().filter(x => x.left);
    const names = stock().filter(x => !x.left).map(x => x.name).join(' · ');
    app.innerHTML = `<div class="result-heading"><h2>${state.buy ? '청고추를 더해 이렇게 만들어요' : '가진 재료로 이렇게 만들어요'}</h2></div><p class="portion-info">각 요리 <strong>2인분</strong> 기준이에요</p>${state.scenario === 'purchaseOnly' ? '<div class="notice">가진 재료만으로는 조합을 찾지 못해 조금 사는 조합을 보여드려요.</div>' : ''}<div class="chooser"><p class="count-label" id="count-label">몇 가지 요리를 만들까요?</p><div class="tabs" role="tablist" aria-labelledby="count-label">${[3, 4, 5].map(n => `<button role="tab" tabindex="${n === state.count ? 0 : -1}" aria-selected="${n === state.count}" data-count="${n}">${n}가지</button>`).join('')}</div></div><section class="stock-overview" aria-label="소진과 잔량 요약"><div class="overview-line"><span class="overview-label">다 써요 <b>${fullCount(state.count)}개</b></span><strong>${names}</strong></div><div class="overview-line"><span class="overview-label">남아요 <b>${remaining.length}개</b></span><strong>${remaining.length ? remaining.map(x => `${x.name} ${fmt(x.left)}${x.unit}`).join(' · ') : '남는 재료 없음'}</strong></div><button class="overview-detail" data-action="stock">재료별 사용량 보기 <span aria-hidden="true">›</span></button></section>${state.buy ? '<div class="buy-context"><span>청고추 15g 추가 · 대파 0.2대 더 사용</span><button class="plain" data-action="no-buy">구매 없이 보기</button></div>' : ''}${recipeList()}${!state.buy ? '<section class="purchase-card" aria-label="추가 구매 제안"><p class="purchase-kicker">조금 사는 조합</p><h3>남은 대파까지 써볼까요?</h3><p>청고추 조금 (15g)을 더하면<br>대파를 0.2대 더 쓸 수 있어요.</p><button class="purchase-button" data-action="buy">조금 사는 조합 보기 <span aria-hidden="true">→</span></button></section>' : ''}`;
}
function openRecipe(i) { document.getElementById('sheet-label').textContent = '레시피 상세'; const r = selected()[i]; document.getElementById('detail-body').innerHTML = `<p class="eyebrow">${i === 0 ? '먼저 만들 요리' : '다음에 만들 요리'} · ${r.time}분</p><h2 id="detail-title">${state.buy && i === 0 ? '청고추 두부 달걀전' : r.name}</h2><p>이 조합에서는 2인분을 만들어요.</p><h3>이 요리에 사용하는 재료</h3>${r.use.map((n, k) => n ? `<div class="ingredient"><span>${inventory[k].name}</span><span>${fmt(n)}${inventory[k].unit} <small>(약 ${fmt(n * inventory[k].grams)}g)</small></span></div>` : '').join('')}${state.buy && i === 0 ? '<div class="ingredient"><span>청고추 · 추가 구매</span><span>조금 (15g)</span></div>' : ''}${pantryIngredients[i].map(item => `<div class="ingredient"><span>${item.name}</span><span>${item.amount}</span></div>`).join('')}<p><small>양념과 물을 포함한 전체 재료 · 2인분 기준</small></p><details><summary>원문 분량 보기</summary><p>원문도 2인분 기준인 가상 레시피입니다. 원문 재료와 분량은 위 전체 재료 목록과 같습니다.</p></details><h3>만드는 법</h3><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol><p class="notice">조리법과 환산량은 화면 검토용 가상 데이터입니다.</p>`; dialog.showModal(); }
document.getElementById('scenario').addEventListener('change', e => { state.scenario = e.target.value; state.buy = state.scenario === 'purchaseOnly'; state.input = false; render(); });
document.getElementById('back').addEventListener('click', () => { state.input = !state.input; render(); });
app.addEventListener('keydown', e => { if (!e.target.dataset.count || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key))
    return; e.preventDefault(); state.count = e.key === 'Home' ? 3 : e.key === 'End' ? 5 : 3 + (state.count - 3 + (e.key === 'ArrowRight' ? 1 : 2)) % 3; render(); app.querySelector(`[data-count="${state.count}"]`).focus(); });
app.addEventListener('click', e => { const b = e.target.closest('button'); if (!b)
    return; if (b.dataset.count) {
    state.count = Number(b.dataset.count);
    render();
}
else if (b.dataset.recipe !== undefined)
    openRecipe(Number(b.dataset.recipe));
else if (b.dataset.action) {
    const a = b.dataset.action;
    if (a === 'stock') {
        openStock();
        return;
    }
    if (a === 'buy')
        state.buy = true;
    if (a === 'no-buy') {
        state.buy = false;
        state.scenario = 'normal';
        document.getElementById('scenario').value = 'normal';
    }
    if (a === 'input')
        state.input = true;
    if (a === 'return')
        state.input = false;
    if (a === 'retry') {
        state.scenario = 'normal';
        state.buy = false;
        document.getElementById('scenario').value = 'normal';
    }
    render();
} });
dialog.querySelector('.close').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', e => { if (e.target === dialog) {
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
        dialog.close();
} });
render();
// 바텀시트 복귀: 호출한 버튼이 재렌더링되어도 같은 의미의 버튼으로 초점을 돌립니다.
(() => {
    const overlay = document.getElementById('detail');
    let origin = null;
    let originSelector = '';
    let position = 0;
    document.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || overlay.contains(button) || overlay.open)
            return;
        origin = button;
        position = window.scrollY;
        const attributes = ['data-recipe', 'data-edit', 'data-action', 'data-flow', 'data-act'];
        const attribute = attributes.find(name => button.hasAttribute(name));
        originSelector = attribute ? '[' + attribute + '="' + CSS.escape(button.getAttribute(attribute)) + '"]' : button.id ? '#' + CSS.escape(button.id) : '';
    }, true);
    overlay.addEventListener('close', () => {
        requestAnimationFrame(() => {
            let target = origin && origin.isConnected ? origin : null;
            if (!target && originSelector)
                target = document.querySelector(originSelector);
            if (!target)
                target = document.getElementById('back');
            if (target)
                target.focus({ preventScroll: true });
            window.scrollTo({ top: position, behavior: 'instant' });
        });
    });
    // 키보드 등으로 보이는 영역이 줄면 시트 높이를 해당 영역에 맞춥니다.
    function fitViewport() {
        const viewport = window.visualViewport;
        document.documentElement.style.setProperty('--visible-height', (viewport ? viewport.height : window.innerHeight) + 'px');
        const field = document.activeElement;
        if (field && field.matches('input,select') && (!overlay.open || overlay.contains(field))) {
            requestAnimationFrame(() => field.scrollIntoView({ block: 'nearest', inline: 'nearest' }));
        }
    }
    if (window.visualViewport)
        window.visualViewport.addEventListener('resize', fitViewport);
    window.addEventListener('resize', fitViewport);
    fitViewport();
})();
</script>
</body>
</html>
