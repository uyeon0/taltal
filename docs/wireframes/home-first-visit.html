<!-- 이 시안의 문구와 상세 기능은 모두 임시입니다. 구현 기준은 docs/requirements/, docs/copy.md입니다. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 방문 · 서비스 소개</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<style>

@font-face {
  font-family: Gumi;
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/GumiRomanceTTF.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
:root {
  --primary: #FA8835;
  --light: #FAFAF7;
  --ink: #20211E;
  --muted: #5F625A;
  --line: #CFD1C9;
  --pressed: #234386;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--light); color: var(--ink); font: 16px/1.6 SUIT, sans-serif; }
a { color: inherit; }
.page { max-width: 430px; margin: auto; min-height: 100svh; }
.header { display: flex; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--ink); font-size: 14px; }
h1, h2 { font-family: Gumi, SUIT, sans-serif; font-weight: 400; font-synthesis: none; }
h1 { font-size: 36px; line-height: 1.25; margin: 0; }
h2 { font-size: 24px; line-height: 1.4; margin: 0 0 16px; }
p { margin: 0; }
.hero { background: var(--primary); padding: 24px 20px; border-bottom: 2px solid var(--ink); }
.eyebrow { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.lead { margin-top: 16px; }
.mascot-slot { display: grid; place-content: center; text-align: center; border: 1px dashed var(--ink); border-radius: 46% 48% 43% 40%; font-size: 14px; line-height: 1.5; background: transparent; }
.mascot-slot span { display: block; }
.mascot-slot small { font-size: 14px; }
.intro-mascot { width: 164px; height: 140px; margin: 24px auto; }
.example { background: var(--light); border: 2px solid var(--ink); border-radius: 12px; padding: 16px; }
.example-heading { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; }
.example-heading span { color: var(--muted); }
.example strong { font-size: 20px; font-weight: 600; }
.example-detail { font-size: 14px; padding: 10px 0; margin-top: 10px; border-top: 1px solid var(--line); }
.remainder { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.action { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 58px; padding: 14px 18px; border: 2px solid var(--ink); border-radius: 10px; font-size: 18px; font-weight: 700; text-decoration: none; }
.action-dark { background: var(--ink); color: var(--light); margin-top: 20px; }
.action-primary { background: var(--primary); color: var(--ink); }
.action:hover, .action:active { background: var(--pressed); color: white; }
a:focus-visible, summary:focus-visible { outline: 3px solid var(--pressed); outline-offset: 4px; }
.helper { font-size: 14px; margin-top: 10px; }
.content { padding: 24px 20px; }
.steps { padding-left: 22px; margin: 0; }
.steps li { padding: 5px 0; }
.return-hero { position: relative; isolation: isolate; min-height: 310px; padding-bottom: 28px; }
.return-hero h1 { position: relative; z-index: 1; max-width: 250px; }
.return-mascot { position: absolute; width: 140px; height: 144px; right: 16px; bottom: 22px; z-index: -1; transform: rotate(5deg); }
.return-copy { margin-top: 28px; max-width: 170px; }
.section-label { margin: 0 0 14px; font-weight: 600; }
.muted { color: var(--muted); }
.secondary-action { display: flex; justify-content: space-between; gap: 12px; text-decoration: none; font-weight: 600; padding: 20px 0 16px; border-bottom: 1px solid var(--line); margin-top: 8px; }
.secondary-action:hover, .secondary-action:active { color: var(--pressed); }
.pantry { margin-top: 20px; font-size: 14px; }
.pantry summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; min-height: 44px; list-style: none; }
.pantry summary::-webkit-details-marker { display: none; }
.pantry summary span { text-decoration: underline; white-space: nowrap; }
.pantry ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; list-style: none; padding: 16px 0 0; margin: 0; }
@media (min-width: 600px) { body { background: #E9E9E4; padding: 24px 0; } .page { background: var(--light); border: 1px solid var(--ink); } }
@media (max-width: 360px) { h1 { font-size: 34px; } .return-mascot { width: 124px; height: 136px; right: 12px; } }
</style>
</head>
<body>
<main class="page">
<header class="header"><span>서비스명 미정</span><span>오늘의 요리 준비</span></header>
  <section class="hero" aria-labelledby="intro-title">
    <p class="eyebrow">가진 재료에서 시작하는 한 끼</p>
    <h1 id="intro-title">가진 재료로,<br>오늘의 요리 조합.</h1>
    <p class="lead">재료와 양을 알려주면<br>여러 요리와 남는 양까지 찾아줘요.</p>
    <div class="mascot-slot intro-mascot" role="img" aria-label="다람쥐 캐릭터 배치 자리"><span>캐릭터 자리</span><small>다람쥐</small></div>
    <section class="example" aria-label="서비스 결과 가상 예시">
      <p class="example-heading"><b>이렇게 알려줘요</b><span>가상 예시</span></p>
      <p><strong>두부 300g</strong>으로 두 가지 요리</p>
      <p class="example-detail">두부조림에 150g · 국에 100g</p>
      <p class="remainder"><span>냉장고에 남는 두부</span><strong>50g</strong></p>
    </section>
    <a class="action action-dark" href="home-returning.html"><span>내 재료로 시작하기</span><span aria-hidden="true">→</span></a>
    <p class="helper">다음 화면에서 재료와 양을 입력해요.</p>
  </section>
  <section class="content" aria-labelledby="steps-title">
    <h2 id="steps-title">재료를 나눠 쓰는 방법까지.</h2>
    <ol class="steps">
      <li>가진 재료와 양을 입력해요.</li>
      <li>여러 요리의 조합을 확인해요.</li>
      <li>어디에 얼마나 쓰고 남는지 살펴봐요.</li>
    </ol>
  </section>
</main>
</body>
</html>
